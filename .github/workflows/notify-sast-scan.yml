name: Notify SAST Scan Results

on:
  workflow_run:
    workflows: ["SAST Scan Project 3"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get CodeQL Analysis Summary
        id: codeql_summary
        run: |
          SUMMARY="CodeQL scan for ${{ github.event.workflow_run.head_branch }} completed with status: ${{ github.event.workflow_run.conclusion }}.
          For detailed alerts, check the Security tab: https://github.com/${{ github.repository }}/security/code-scanning?query=branch%3A${{ github.event.workflow_run.head_branch }}"
          echo "::set-output name=content::$SUMMARY"

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#security-alerts'
          SLACK_COLOR: ${{ github.event.workflow_run.conclusion == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            *SAST Scan Report - Project 3*
            *Workflow:* ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})
            *Status:* `${{ github.event.workflow_run.conclusion }}`
            *Repo:* `${{ github.repository }}`
            *Branch:* `${{ github.event.workflow_run.head_branch }}`
            *Commit:* `${{ github.event.workflow_run.head_sha }}`
            *Link:* ${{ github.event.workflow_run.html_url }}
            *Summary:*
            ${{ steps.codeql_summary.outputs.content }}
          SLACK_USERNAME: GitHub Actions

      - name: Create Jira Issue
        uses: atlassian/gajira-create@v3
        if: github.event.workflow_run.conclusion == 'failure' # Only create Jira issue on failure
        with:
          host: ${{ secrets.JIRA_BASE_URL }}
          token: ${{ secrets.JIRA_API_TOKEN }}
          username: ${{ secrets.JIRA_USER_EMAIL }}
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issue-type: 'Bug'
          summary: "SAST Scan Failed - Project 3: ${{ github.event.workflow_run.head_branch }}"
          description: |
            A SAST security scan failed for Project 3.
            * Workflow Run: ${{ github.event.workflow_run.html_url }}
            * Repository: ${{ github.repository }}`
            * Branch: ${{ github.event.workflow_run.head_branch }}
            * Commit SHA: ${{ github.event.workflow_run.head_sha }}
            * Detailed Alerts: https://github.com/${{ github.repository }}/security/code-scanning?query=branch%3A${{ github.event.workflow_run.head_branch }}
          priority: 'High'