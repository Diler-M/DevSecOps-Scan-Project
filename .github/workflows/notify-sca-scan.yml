name: Notify SCA Scan Results

on:
  workflow_run:
    workflows: ["SCA Scan Project 4"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Trivy Image Scan Artifact
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowRun = context.payload.workflow_run; // Corrected access to workflow_run

            if (!workflowRun) {
                console.error("workflow_run object is undefined in context.payload. This workflow was likely not triggered by a workflow_run event or the event data is missing.");
                core.setFailed("Workflow run event data not found. Cannot proceed with artifact download.");
                return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: workflowRun.id,
            });

            const artifactName = 'trivy-image-report'; // This matches the name you set in Project 4
            const trivyImageArtifact = artifacts.data.artifacts.find(artifact => artifact.name === artifactName);

            if (trivyImageArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: trivyImageArtifact.id,
                archive_format: 'zip',
              });
              const fs = require('fs');
              const AdmZip = require('adm-zip');
              const zip = new AdmZip(Buffer.from(download.data));
              zip.extractAllTo('.', true);
              console.log(`Successfully extracted ${artifactName}.zip`);
            } else {
              console.log(`No artifact found with name: ${artifactName}. This may mean Project 4 did not upload it or the name is incorrect.`);
              // If not finding the artifact should be a failure, uncomment the next line
              // core.setFailed(`Required artifact '${artifactName}' not found.`);
            }
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Trivy Image Scan Report (JSON) and Summarize
        id: read_report
        run: |
          REPORT_FILE="trivy-image-report.json"
          if [ -f "$REPORT_FILE" ]; then
            # Extract high-level summary (e.g., number of critical/high vulnerabilities)
            # You can customize this 'jq' command to extract specific details you need.
            # This example counts vulnerabilities by severity.
            SUMMARY_CONTENT=$(jq -r '
              .Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] |
              "  \(.VulnerabilityID // "") [\(.Severity // "UNKNOWN")] \(.Title // .Description // "")"
            ' "$REPORT_FILE" | head -n 10 | sed "s/^/    /" ; \
            echo "---" ; \
            echo "Total Vulnerabilities by Severity:")
            
            SEVERITY_COUNTS=$(jq -r '
              .Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | .Severity // "UNKNOWN"
            ' "$REPORT_FILE" | sort | uniq -c | awk '{print "    - "$2": "$1}')
            
            FULL_SUMMARY="${SUMMARY_CONTENT}\n${SEVERITY_COUNTS}\n\nFull report available as artifact."
            echo "::set-output name=content::$FULL_SUMMARY"
          else
            echo "::set-output name=content::No detailed JSON report found. Check Project 4 logs or artifact uploads."
          fi

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#security-alerts'
          SLACK_COLOR: ${{ github.event.workflow_run.conclusion == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            *SCA Scan Report - Project 4*
            *Workflow:* ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})
            *Status:* `${{ github.event.workflow_run.conclusion }}`
            *Repo:* `${{ github.repository }}`
            *Branch:* `${{ github.event.workflow_run.head_branch }}`
            *Commit:* `${{ github.event.workflow_run.head_sha }}`
            *Link:* ${{ github.event.workflow_run.html_url }}
            *Summary:*
            ${{ steps.read_report.outputs.content }}
          SLACK_USERNAME: GitHub Actions

      - name: Create Jira Issue
        uses: atlassian/gajira-create@v3
        if: github.event.workflow_run.conclusion == 'failure' # Only create Jira issue on failure
        with:
          host: ${{ secrets.JIRA_BASE_URL }}
          token: ${{ secrets.JIRA_API_TOKEN }}
          username: ${{ secrets.JIRA_USER_EMAIL }}
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issue-type: 'Bug'
          summary: "SCA Scan Failed - Project 4: ${{ github.event.workflow_run.head_branch }}"
          description: |
            A SCA security scan failed for Project 4.
            * Workflow Run: ${{ github.event.workflow_run.html_url }}
            * Repository: ${{ github.repository }}
            * Branch: ${{ github.event.workflow_run.head_branch }}
            * Commit SHA: ${{ github.event.workflow_run.head_sha }}
            * Scan Details:
              ${{ steps.read_report.outputs.content }}
          priority: 'High'