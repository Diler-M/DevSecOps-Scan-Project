name: Notify SCA Scan Results

on:
  workflow_run:
    workflows: ["SCA Scan Project 4"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Trivy Image Scan Artifact
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowRun = github.event.workflow_run;

            // Fetch workflow run artifacts
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: workflowRun.id,
            });

            // Assuming Trivy image scan output is in a file and attached as an artifact
            const trivyImageArtifact = artifacts.data.artifacts.find(artifact => artifact.name === 'trivy-image-report'); # Name of the artifact from Project 4

            if (trivyImageArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: trivyImageArtifact.id,
                archive_format: 'zip',
              });
              const fs = require('fs');
              const admZip = require('adm-zip');
              const zip = new admZip(Buffer.from(download.data));
              zip.extractAllTo('.');
            } else {
              console.log('No trivy-image-report artifact found. Ensure Project 4 uploads it.');
            }

      - name: Read Trivy Image Scan Report (if downloaded)
        id: read_report
        run: |
          # This step assumes the Trivy report is extracted as a file, e.g., trivy_image_report.txt
          # Adjust the filename based on how it's saved in Project 4
          if [ -f "trivy_image_report.txt" ]; then
            REPORT_CONTENT=$(cat trivy_image_report.txt)
            echo "::set-output name=content::$REPORT_CONTENT"
          else
            echo "::set-output name=content::No detailed report found."
          fi

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#security-alerts'
          SLACK_COLOR: ${{ github.event.workflow_run.conclusion == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            *SCA Scan Report - Project 4*
            *Workflow:* ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})
            *Status:* `${{ github.event.workflow_run.conclusion }}`
            *Repo:* `${{ github.repository }}`
            *Branch:* `${{ github.event.workflow_run.head_branch }}`
            *Commit:* `${{ github.event.workflow_run.head_sha }}`
            *Link:* ${{ github.event.workflow_run.html_url }}
            *Summary:*
            ${{ steps.read_report.outputs.content }}
          SLACK_USERNAME: GitHub Actions

      - name: Create Jira Issue
        uses: atlassian/gajira-create@v3 
        if: github.event.workflow_run.conclusion == 'failure' # Only create Jira issue on failure
        with:
          host: ${{ secrets.JIRA_BASE_URL }}
          token: ${{ secrets.JIRA_API_TOKEN }}
          username: ${{ secrets.JIRA_USER_EMAIL }}
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issue-type: 'Bug'
          summary: "SCA Scan Failed - Project 4: ${{ github.event.workflow_run.head_branch }}"
          description: |
            A SCA security scan failed for Project 4.
            * Workflow Run: ${{ github.event.workflow_run.html_url }}
            * Repository: ${{ github.repository }}
            * Branch: ${{ github.event.workflow_run.head_branch }}
            * Commit SHA: ${{ github.event.workflow_run.head_sha }}
            * Scan Details:
              ${{ steps.read_report.outputs.content }}