name: IaC Security Scan Project 2

on:
  push:
    branches:
      - main

jobs:
  deploy-and-scan:
    name: Run IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -yq trivy

  build:
    name: IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'misconfig'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          ignore-unfixed: true

      - name: Save scan results for Slack and Jira
        run: |
          trivy config --format table --output trivy_iac_results.txt .

      - name: Post IaC Scan Results to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          summary="*IaC Security Scan Completed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nStatus: Completed.\n\n*Top Findings:*\n$(head -n 20 trivy_iac_results.txt)"
          payload="{\"text\": \"$summary\"}"
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
      
      - name: Create Jira Issue for IaC Scan Findings
        uses: atlassian/gajira-create@v3
        with:
          useEnvVars: true
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issuetype: 'Task'
          summary: "[IaC Scan] Findings on ${{ github.repository }}@${{ github.ref_name }}"
          description: |
            The automated IaC security scan using Trivy has completed.

            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}

            *Top Findings:*
            ```
            $(head -n 20 trivy_iac_results.txt)
            ```

            Please review full details in pipeline artifacts for remediation.
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}


