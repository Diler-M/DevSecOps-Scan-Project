name: Notify IaC Security Scan Results

on:
  workflow_run:
    workflows: ["IaC Security Scan Project 2"] # Trigger on completion of IaC scan
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Trivy Scan Artifact
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowRun = github.event.workflow_run;

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: workflowRun.id,
            });

            const trivyArtifact = artifacts.data.artifacts.find(artifact => artifact.name === 'trivy-iac-report');

            if (trivyArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: trivyArtifact.id,
                archive_format: 'zip',
              });
              const fs = require('fs');
              const AdmZip = require('adm-zip'); // Corrected capitalization
              const zip = new AdmZip(Buffer.from(download.data));
              zip.extractAllTo('.', true);
            } else {
              console.log('No trivy-iac-report artifact found. Ensure Project 2 uploads it.');
            }

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: 'security-alerts'
          SLACK_COLOR: ${{ github.event.workflow_run.conclusion == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            *IaC Security Scan Report - Project 2*
            *Workflow:* ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})
            *Status:* `${{ github.event.workflow_run.conclusion }}`
            *Repo:* `${{ github.repository }}`
            *Branch:* `${{ github.event.workflow_run.head_branch }}`
            *Commit:* `${{ github.event.workflow_run.head_sha }}`
            *Link:* ${{ github.event.workflow_run.html_url }}
            *Summary:*
            ${{ steps.read_report.outputs.content }}
          SLACK_USERNAME: GitHub Actions

      - name: Create Jira Issue
        uses: atlassian/gajira-create@v3 
        if: github.event.workflow_run.conclusion == 'failure' # Only create Jira issue on failure
        with:
          host: ${{ secrets.JIRA_BASE_URL }}
          token: ${{ secrets.JIRA_API_TOKEN }}
          username: ${{ secrets.JIRA_USER_EMAIL }}
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issue-type: 'Bug'
          summary: "IaC Security Scan Failed - Project 2: ${{ github.event.workflow_run.head_branch }}"
          description: |
            An IaC security scan failed for Project 2.
            * Workflow Run: ${{ github.event.workflow_run.html_url }}
            * Repository: ${{ github.repository }}
            * Branch: ${{ github.event.workflow_run.head_branch }}
            * Commit SHA: ${{ github.event.workflow_run.head_sha }}
            * Scan Details:
              ${{ steps.read_report.outputs.content }}