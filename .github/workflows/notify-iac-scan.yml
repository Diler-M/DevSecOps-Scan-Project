name: Notify IaC Security Scan Results

on:
  workflow_run:
    workflows: ["IaC Security Scan Project 2"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Trivy IaC Report Artifact
        uses: actions/download-artifact@v4 
        with:
          name: trivy-iac-report 
          path: .

      - name: Read Trivy Scan Report (JSON) and Summarize
        id: read_report
        run: |
          REPORT_FILE="trivy-iac-report.json"
          if [ -f "$REPORT_FILE" ]; then
            # Extract high-level summary (e.g., number of critical/high misconfigurations)
            # You can customize this 'jq' command to extract specific details you need.
            # This example counts misconfigurations by severity.
            SUMMARY_CONTENT=$(jq -r '
              .Results[] | select(.Misconfigurations != null) | .Misconfigurations[] |
              "  \(.Type // "") [\(.Severity // "UNKNOWN")] \(.Title // .Description // "") - \(.AVD_ID // "")"
            ' "$REPORT_FILE" | head -n 10 | sed "s/^/    /" ; \
            echo "---" ; \
            echo "Total Misconfigurations by Severity:")
            
            SEVERITY_COUNTS=$(jq -r '
              .Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | .Severity // "UNKNOWN"
            ' "$REPORT_FILE" | sort | uniq -c | awk '{print "    - "$2": "$1}')
            
            FULL_SUMMARY="${SUMMARY_CONTENT}\n${SEVERITY_COUNTS}\n\nFull report available as artifact."
            echo "::set-output name=content::$FULL_SUMMARY"
          else
            echo "::set-output name=content::No detailed JSON report found. Check Project 2 logs or artifact uploads."
          fi

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#security-alerts'
          SLACK_COLOR: ${{ github.event.workflow_run.conclusion == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            *IaC Security Scan Report - Project 2*
            *Workflow:* ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.run_number }})
            *Status:* `${{ github.event.workflow_run.conclusion }}`
            *Repo:* `${{ github.repository }}`
            *Branch:* `${{ github.event.workflow_run.head_branch }}`
            *Commit:* `${{ github.event.workflow_run.head_sha }}`
            *Link:* ${{ github.event.workflow_run.html_url }}
            *Summary:*
            ${{ steps.read_report.outputs.content }}
          SLACK_USERNAME: GitHub Actions

      - name: Create Jira Issue
        uses: atlassian/gajira-create@v3
        if: github.event.workflow_run.conclusion == 'failure' # Only create Jira issue on failure
        with:
          host: ${{ secrets.JIRA_BASE_URL }}
          token: ${{ secrets.JIRA_API_TOKEN }}
          username: ${{ secrets.JIRA_USER_EMAIL }}
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issue-type: 'Bug'
          summary: "IaC Security Scan Failed - Project 2: ${{ github.event.workflow_run.head_branch }}"
          description: |
            An IaC security scan failed for Project 2.
            * Workflow Run: ${{ github.event.workflow_run.html_url }}
            * Repository: ${{ github.repository }}
            * Branch: ${{ github.event.workflow_run.head_branch }}
            * Commit SHA: ${{ github.event.workflow_run.head_sha }}
            * Scan Details:
              ${{ steps.read_report.outputs.content }}
          priority: 'High'