name: SCA Scan Project 4

on:
  push:
    branches:
        - main

jobs:
  deploy-and-scan:
    name: Pull Docker Image and SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Image
        run: docker pull dilerm13/dockerproject_29-06-25:latest

      - name: Install Trivy
        run: |
          curl -sfL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -yq trivy
          
  build:
    name: Image Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        scanners: 'vuln' 
        image-ref: dilerm13/dockerproject_29-06-25:latest
        scan-ref: '.'
        hide-progress: false
        format: 'table'
        ignore-unfixed: true

    - name: Post SCA Scan Results to Slack
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
          summary=$(echo -e "SCA Image Scan Completed\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nStatus: Completed\n\nTop Findings:\n$(head -n 20 trivy_sca_results.txt)")
          payload=$(jq -n --arg text "$summary" '{text: $text}')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

    - name: Create Jira Issue for SCA Scan Findings
      uses: atlassian/gajira-create@v3
      with:
          useEnvVars: true
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issuetype: 'Task'
          summary: "[SCA Scan] Findings on ${{ github.repository }}@${{ github.ref_name }}"
          description: |
            The automated SCA image scan using Trivy has completed.

            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}

            *Top Findings:*
            ```
            $(head -n 20 trivy_sca_results.txt)
            ```

            Please review full details in pipeline artifacts for remediation.
      env:
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}