name: SAST Scan Project 3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies  
        uses: actions/setup-python@v3
        with:
          python-version: 3.x
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Create Jira Issue for IaC Scan Findings
        uses: atlassian/gajira-create@v3
        with:
          useEnvVars: true
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issuetype: Bug
          summary: "[IaC Security Scan] Findings on ${{ github.repository }}@${{ github.ref_name }}"
          description: |
            The automated IaC security scan using Trivy has completed.

            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}

            *Top Findings:*
            ```
            $(head -n 20 trivy_iac_results.txt)
            ```

            Please review full details in pipeline artifacts for remediation.
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}